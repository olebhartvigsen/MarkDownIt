name: Build MarkDownIt

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (x64)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find UICC.exe
        id: find-uicc
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\uicc.exe",
            "C:\Program Files\Windows Kits\10\bin\*\x64\uicc.exe"
          )
          $uicc = $null
          foreach ($p in $paths) {
            $found = Get-ChildItem $p -ErrorAction SilentlyContinue | Select-Object -Last 1
            if ($found) { $uicc = $found; break }
          }
          if ($uicc) {
            "uicc_path=$($uicc.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Found UICC: $($uicc.FullName)"
          } else {
            # Try using vswhere to find the SDK path
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $sdkPath = & $vswhere -latest -property installationPath
              Write-Host "VS install path: $sdkPath"
            }
            Write-Error "UICC.exe not found in any Windows SDK location"
            exit 1
          }

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DUICC_EXE="${{ steps.find-uicc.outputs.uicc_path }}"

      - name: Build Release exe
        run: cmake --build build --config Release

      - name: Verify exe type
        shell: bash
        run: file build/Release/MarkDownIt.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkDownIt-x64
          path: build/Release/MarkDownIt.exe

  test:
    name: Tests
    runs-on: windows-2022
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake (with tests)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTS=ON

      - name: Build tests
        run: cmake --build build --config Release

      - name: Run tests
        shell: bash
        run: build/Release/MarkDownIt.tests.exe

name: Build MarkDownIt

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (x64)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find SDK tools and generate uiribbon.lib
        id: find-sdk
        shell: powershell
        run: |
          # Find UICC.exe (build tool, any arch)
          $uicc = Get-ChildItem -Path "C:\Program Files*\Windows Kits\10\bin" -Recurse -Filter "uicc.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if ($uicc) {
            "uicc_path=$($uicc.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Found UICC: $($uicc.FullName)"
          }

          # Find propsys.lib
          $propsysLib = Get-ChildItem -Path "C:\Program Files*\Windows Kits\10\Lib" -Recurse -Filter "propsys.lib" -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -match "x64" } | Sort-Object FullName | Select-Object -Last 1
          if ($propsysLib) {
            "propsys_lib=$($propsysLib.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Found propsys.lib: $($propsysLib.FullName)"
          }

          # uiribbon.lib is not shipped with modern Windows SDKs.
          # Generate it from uiribbon.dll using dumpbin + lib.exe.
          $dumpbin = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $libexe = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\lib.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "dumpbin: $dumpbin"
          Write-Host "lib.exe: $libexe"

          $libDir = "D:\a\_temp\uiribbon_lib"
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null
          $defFile = "$libDir\uiribbon.def"
          $libFile = "$libDir\uiribbon.lib"

          # Export symbols from uiribbon.dll
          $exports = & $dumpbin /exports "C:\Windows\System32\uiribbon.dll"
          $defContent = "LIBRARY uiribbon.dll`nEXPORTS`n"
          foreach ($line in $exports) {
            if ($line -match '^\s+\d+\s+[0-9A-F]+\s+(\S+)') {
              $funcName = $matches[1]
              $defContent += "  $funcName`n"
            }
          }
          Set-Content -Path $defFile -Value $defContent -Encoding ASCII
          Write-Host "Generated .def with exports"

          # Create import library
          & $libexe /def:"$defFile" /out:"$libFile" /machine:x64
          if (Test-Path $libFile) {
            "uiribbon_lib=$libFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Generated uiribbon.lib: $libFile"
          } else {
            Write-Error "Failed to generate uiribbon.lib"
            exit 1
          }

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DUICC_EXE="${{ steps.find-sdk.outputs.uicc_path }}" `
            -DUIRIBBON_LIB="${{ steps.find-sdk.outputs.uiribbon_lib }}" `
            -DPROPSYS_LIB="${{ steps.find-sdk.outputs.propsys_lib }}"

      - name: Build Release exe
        run: cmake --build build --config Release

      - name: Show generated ribbon files
        shell: bash
        run: |
          echo "=== ribbonUI.h ==="
          cat build/ribbon/ribbonUI.h
          echo "=== ribbonUI.rc2 ==="
          cat build/ribbon/ribbonUI.rc2
          echo "=== app.res check ==="
          python3 -c "
          with open('build/ribbon/app.res','rb') as f:
              data = f.read()
          print(f'.res file size: {len(data)} bytes')
          # Search for MARKDOWNIT_RIBBON as wide string
          wide = 'MARKDOWNIT_RIBBON'.encode('utf-16-le')
          idx = data.find(wide)
          print(f'MARKDOWNIT_RIBBON wide string in .res: {idx}')
          if idx > 0:
              print('Resource name IS in .res')
          else:
              print('Resource name NOT in .res')
              # Try ASCII
              idx2 = data.find(b'MARKDOWNIT_RIBBON')
              print(f'MARKDOWNIT_RIBBON ASCII in .res: {idx2}')
          "

      - name: Verify exe type
        shell: bash
        run: file build/Release/MarkDownIt.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkDownIt-x64
          path: build/Release/MarkDownIt.exe

      - name: Build and run tests
        shell: bash
        run: |
          cmake -B build-tests -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTS=ON
          cmake --build build-tests --config Release
          build-tests/Release/MarkDownIt.tests.exe

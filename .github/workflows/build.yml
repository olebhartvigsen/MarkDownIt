name: Build MarkDownIt

on:
  push:
    branches:
      - main
      - feat/mermaid-flowchart
      - feat/pdf-word-support
      - feat/macos-port
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build (x64)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find SDK tools and generate uiribbon.lib
        id: find-sdk
        shell: powershell
        run: |
          # Find UICC.exe (build tool, any arch)
          $uicc = Get-ChildItem -Path "C:\Program Files*\Windows Kits\10\bin" -Recurse -Filter "uicc.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if ($uicc) {
            "uicc_path=$($uicc.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Found UICC: $($uicc.FullName)"
          }

          # Find propsys.lib
          $propsysLib = Get-ChildItem -Path "C:\Program Files*\Windows Kits\10\Lib" -Recurse -Filter "propsys.lib" -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -match "x64" } | Sort-Object FullName | Select-Object -Last 1
          if ($propsysLib) {
            "propsys_lib=$($propsysLib.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Found propsys.lib: $($propsysLib.FullName)"
          }

          # uiribbon.lib is not shipped with modern Windows SDKs.
          # Generate it from uiribbon.dll using dumpbin + lib.exe.
          $dumpbin = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $libexe = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\lib.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "dumpbin: $dumpbin"
          Write-Host "lib.exe: $libexe"

          $libDir = "D:\a\_temp\uiribbon_lib"
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null
          $defFile = "$libDir\uiribbon.def"
          $libFile = "$libDir\uiribbon.lib"

          # Export symbols from uiribbon.dll
          $exports = & $dumpbin /exports "C:\Windows\System32\uiribbon.dll"
          $defContent = "LIBRARY uiribbon.dll`nEXPORTS`n"
          foreach ($line in $exports) {
            if ($line -match '^\s+\d+\s+[0-9A-F]+\s+(\S+)') {
              $funcName = $matches[1]
              $defContent += "  $funcName`n"
            }
          }
          Set-Content -Path $defFile -Value $defContent -Encoding ASCII
          Write-Host "Generated .def with exports"

          # Create import library
          & $libexe /def:"$defFile" /out:"$libFile" /machine:x64
          if (Test-Path $libFile) {
            "uiribbon_lib=$libFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Generated uiribbon.lib: $libFile"
          } else {
            Write-Error "Failed to generate uiribbon.lib"
            exit 1
          }

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DUICC_EXE="${{ steps.find-sdk.outputs.uicc_path }}" `
            -DUIRIBBON_LIB="${{ steps.find-sdk.outputs.uiribbon_lib }}" `
            -DPROPSYS_LIB="${{ steps.find-sdk.outputs.propsys_lib }}"

      - name: Build Release exe
        run: cmake --build build --config Release

      - name: Verify exe type
        shell: bash
        run: file build/Release/MarkDownIt.exe

      - name: Build and run tests
        shell: bash
        env:
          # The office export tests write the files they produce here, so the
          # verify-export job can open them with an independent reader.
          MDI_OFFICE_OUT_DIR: ${{ github.workspace }}/office-output
        run: |
          mkdir -p "$MDI_OFFICE_OUT_DIR"
          cmake -B build-tests -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTS=ON
          cmake --build build-tests --config Release
          build-tests/Release/MarkDownIt.tests.exe
          ls -la "$MDI_OFFICE_OUT_DIR"

      # The produced Word and PDF files are validated by an independent reader
      # (python-docx, pypdf) in the verify-export job, not by MarkDownIt itself.
      - name: Upload office output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-output
          path: ${{ github.workspace }}/office-output/
          if-no-files-found: warn

      # Upload AFTER the tests pass, so a red run never publishes a
      # downloadable exe that the deploy loop could pick up unverified.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkDownIt-x64
          path: build/Release/MarkDownIt.exe

  # The native macOS gate. The same test suite the Windows build runs,
  # compiled and executed on Apple Silicon. Every change to the shared
  # core goes through this job before it reaches the macOS app.
  #
  # The runner image is read from the environment, because the macOS
  # runners are scarce and a queue can sit for a long time. The default
  # is macos-15-arm64, the label the pipeline reference pins: the
  # macos-14 images are deprecated and unsupported after November 2,
  # 2026, and macos-26 is the forward option.
  test-macos:
    name: Tests (macOS, Apple Silicon)
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15-arm64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build-native -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build-native --target MarkDownIt.tests -j2

      - name: Run
        run: ./build-native/MarkDownIt.tests

  # The macOS app and the .app bundle. The bundle is uploaded so it can be
  # downloaded and run on a real Mac.
  build-macos:
    name: Build (macOS, Apple Silicon)
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15-arm64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build-mac -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-mac --target MarkDownItMac -j2

      # Every command in the menu has to be carried out. A command that
      # no handler acts on is a silent no-op.
      - name: Verify the menu commands
        run: python3 tools/check_mac_menu.py

      # A Windows header in a shared source has to sit inside a
      # _WIN32 block, or the mac build stops on it.
      - name: Verify the guards of the shared sources
        run: python3 tools/check_shared_guards.py

      # The bundle is checked before it is published, so a red run never
      # offers a bundle that cannot start.
      - name: Verify the bundle
        run: |
          file build-mac/MarkDownIt.app/Contents/MacOS/MarkDownIt
          test -f build-mac/MarkDownIt.app/Contents/Resources/app.icns
          test -f build-mac/MarkDownIt.app/Contents/Info.plist

      - name: Zip the bundle
        run: |
          cd build-mac
          zip -r ../MarkDownIt-macos-arm64.zip MarkDownIt.app

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: MarkDownIt-macos-arm64
          path: MarkDownIt-macos-arm64.zip
          if-no-files-found: error

  oracle:
    name: Mermaid oracle (golden geometry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install oracle deps
        working-directory: tools/mermaid-oracle
        run: npm install --no-audit --no-fund
      - name: Regenerate golden geometry
        run: |
          mkdir -p /tmp/golden
          for f in tests/mermaid/fixtures/*.mmd; do
            name=$(basename "$f" .mmd)
            if [[ "$name" == pie* ]]; then
              node --import ./tools/mermaid-oracle/dom-shim.mjs \
                 tools/mermaid-oracle/pie_oracle.mjs "$f" "/tmp/golden/$name.json"
            elif [[ "$name" == seq* || "$name" == msk* ]]; then
              node --import ./tools/mermaid-oracle/dom-shim-seq.mjs \
                 tools/mermaid-oracle/sequence_oracle.mjs "$f" "/tmp/golden/$name.json"
            elif [[ "$name" == cls* ]]; then
              node --import ./tools/mermaid-oracle/dom-shim.mjs \
                tools/mermaid-oracle/class_oracle.mjs "$f" "/tmp/golden/$name.json"
            elif [[ "$name" == stt* ]]; then
              node --import ./tools/mermaid-oracle/dom-shim.mjs \
                tools/mermaid-oracle/state_oracle.mjs "$f" "/tmp/golden/$name.json"
            else
              node tools/mermaid-oracle/dump.mjs "$f" > "/tmp/golden/$name.json"
            fi
          done
          # flowchart.txt lives outside fixtures/ (referenced directly by
          # tests/mermaid_golden_test.cpp) but is still golden-regenerated.
          node tools/mermaid-oracle/dump.mjs tests/mermaid/flowchart.txt > /tmp/golden/12-flowchart.json
      - name: Fail if committed goldens drift from the oracle
        run: |
          for f in /tmp/golden/*.json; do
            name=$(basename "$f")
            if ! diff -u "tests/mermaid/golden/$name" "$f"; then
              echo "::error::Golden $name is stale. Commit the regenerated file."
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mermaid-golden
          path: /tmp/golden/

  verify-export:
    name: Verify exported Word and PDF (independent reader)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install oracle deps
        run: pip install -r tools/office-oracle/requirements.txt
      - name: Download the files the Windows build produced
        uses: actions/download-artifact@v4
        with:
          name: office-output
          path: office-output
      - name: List what the build produced
        run: ls -la office-output
      - name: Validate the exported .docx against the golden content model
        run: python tools/office-oracle/check_docx.py office-output/reference_from_model.docx
      - name: Validate the exported .pdf against the golden pages
        run: python tools/office-oracle/check_pdf.py office-output/reference_from_model.pdf
      - name: Validate the imported model against the golden model
        run: python tools/office-oracle/check_model_json.py office-output/imported_docx_model.json

  office-oracle:
    name: Office oracle (Word/PDF fixtures and goldens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install oracle deps
        run: pip install -r tools/office-oracle/requirements.txt
      - name: Regenerate fixtures and goldens
        run: |
          python tools/office-oracle/make_fixtures.py \
            --fixtures-dir /tmp/office-oracle/fixtures \
            --golden-dir /tmp/office-oracle/golden
          sha256sum /tmp/office-oracle/fixtures/* /tmp/office-oracle/golden/*
      - name: Fail if committed fixtures or goldens drifted
        run: |
          python tools/office-oracle/check_drift.py tests/office /tmp/office-oracle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-oracle
          path: /tmp/office-oracle/

name: Build MarkDownIt

on:
  push:
    branches:
      - main
      - feat/mermaid-flowchart
      - feat/pdf-word-support
      - feat/macos-port
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Fast, build-free gates that every push runs. They hold the source
  # manifest, the parity ledger and the command coverage against the
  # tree, so drift stops the run before the expensive builds queue.
  # tools/check_alignment.sh runs the same set locally before a push.
  alignment-static:
    name: Static alignment gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The paired-file advisory reads the push range.
          fetch-depth: 0

      - name: Verify the source manifest
        run: |
          python3 tools/test_check_sources_listed.py
          python3 tools/check_sources_listed.py

      - name: Verify the parity ledger
        run: |
          python3 tools/test_check_parity_ledger.py
          python3 tools/check_parity_ledger.py

      - name: Verify the command coverage
        run: |
          python3 tools/test_check_command_coverage.py
          python3 tools/check_command_coverage.py

      - name: Verify the guards of the shared sources
        run: python3 tools/check_shared_guards.py

      - name: Verify the mac sources
        run: python3 tools/check_mac_sources.py

      - name: Verify the screen capture policy
        run: |
          python3 tools/test_check_capture_policy.py
          python3 tools/check_capture_policy.py

      - name: Verify the test inventory checker
        run: python3 tools/test_check_test_inventory.py

      # Advisory only: one side of a renderer or controller pair that
      # changed alone is how the ports drift. A Parity: line in the
      # commit message records the reason and silences it.
      - name: Paired files advisory
        env:
          MDI_BASE: ${{ github.event.before }}
          MDI_HEAD: ${{ github.sha }}
        run: python3 tools/check_paired_changes.py

  build:
    name: Build (x64)
    needs: alignment-static
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find SDK tools and generate uiribbon.lib
        id: find-sdk
        shell: powershell
        run: |
          # Find UICC.exe (build tool, any arch)
          $uicc = Get-ChildItem -Path "C:\Program Files*\Windows Kits\10\bin" -Recurse -Filter "uicc.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if ($uicc) {
            "uicc_path=$($uicc.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Found UICC: $($uicc.FullName)"
          }

          # Find propsys.lib
          $propsysLib = Get-ChildItem -Path "C:\Program Files*\Windows Kits\10\Lib" -Recurse -Filter "propsys.lib" -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -match "x64" } | Sort-Object FullName | Select-Object -Last 1
          if ($propsysLib) {
            "propsys_lib=$($propsysLib.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Found propsys.lib: $($propsysLib.FullName)"
          }

          # uiribbon.lib is not shipped with modern Windows SDKs.
          # Generate it from uiribbon.dll using dumpbin + lib.exe.
          $dumpbin = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $libexe = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\lib.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "dumpbin: $dumpbin"
          Write-Host "lib.exe: $libexe"

          $libDir = "D:\a\_temp\uiribbon_lib"
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null
          $defFile = "$libDir\uiribbon.def"
          $libFile = "$libDir\uiribbon.lib"

          # Export symbols from uiribbon.dll
          $exports = & $dumpbin /exports "C:\Windows\System32\uiribbon.dll"
          $defContent = "LIBRARY uiribbon.dll`nEXPORTS`n"
          foreach ($line in $exports) {
            if ($line -match '^\s+\d+\s+[0-9A-F]+\s+(\S+)') {
              $funcName = $matches[1]
              $defContent += "  $funcName`n"
            }
          }
          Set-Content -Path $defFile -Value $defContent -Encoding ASCII
          Write-Host "Generated .def with exports"

          # Create import library
          & $libexe /def:"$defFile" /out:"$libFile" /machine:x64
          if (Test-Path $libFile) {
            "uiribbon_lib=$libFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Generated uiribbon.lib: $libFile"
          } else {
            Write-Error "Failed to generate uiribbon.lib"
            exit 1
          }

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DUICC_EXE="${{ steps.find-sdk.outputs.uicc_path }}" `
            -DUIRIBBON_LIB="${{ steps.find-sdk.outputs.uiribbon_lib }}" `
            -DPROPSYS_LIB="${{ steps.find-sdk.outputs.propsys_lib }}"

      - name: Build Release exe
        run: cmake --build build --config Release

      - name: Verify exe type
        shell: bash
        run: file build/Release/MarkDownIt.exe

      - name: Build and run tests
        shell: bash
        env:
          # The office export tests write the files they produce here, so the
          # verify-export job can open them with an independent reader.
          MDI_OFFICE_OUT_DIR: ${{ github.workspace }}/office-output
          MDI_SVG_NATIVE_OUT: ${{ runner.temp }}/svg-native.json
          # The transcript tests write their per-case digest here when
          # the variable is set (tests/transcript_test.cpp, batch 5),
          # the same convention the SVG dump follows. The
          # transcript-parity job compares this file against the macOS
          # one, so a platform branch in an editing command fails the
          # pipeline.
          MDI_TRANSCRIPT_OUT: ${{ runner.temp }}/transcript-results.windows.json
        run: |
          mkdir -p "$MDI_OFFICE_OUT_DIR"
          cmake -B build-tests -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTS=ON
          cmake --build build-tests --config Release
          build-tests/Release/MarkDownIt.tests.exe
          python tools/test_svg_arrow_contacts.py --exe build-tests/Release/MarkDownIt.svg-parity.exe
          build-tests/Release/MarkDownIt.svg-parity.exe "$RUNNER_TEMP/svg-commands.json" tests/fixtures/ai-components.svg tests/fixtures/diagram.svg tests/fixtures/svg-parity.svg tests/fixtures/svg-arrow-contacts.svg tests/fixtures/two-boxes.svg tests/fixtures/wide-diagram.svg tests/markdown-mermaid/mermaid-diagram-1788899219877.svg
          ls -la "$MDI_OFFICE_OUT_DIR"
          # Until the transcript corpus is enrolled in the test target,
          # the runner writes nothing and this seeds an empty digest,
          # so the parity job always has both halves to compare. An
          # empty digest on both sides is a passing (and reported)
          # result, not a skip.
          if [ ! -s "$MDI_TRANSCRIPT_OUT" ]; then
            printf '{"cases": []}\n' > "$MDI_TRANSCRIPT_OUT"
          fi
      # The two platform suites must stay the same suite; the parity
      # job compares this list against the macOS one.
      - name: Record the Windows test inventory
        shell: bash
        run: build-tests/Release/MarkDownIt.tests.exe --list > "$RUNNER_TEMP/test-inventory-windows.txt"

      - name: Upload the Windows test inventory
        uses: actions/upload-artifact@v4
        with:
          name: test-inventory-windows
          path: ${{ runner.temp }}/test-inventory-windows.txt
          if-no-files-found: error

      - name: Upload the Windows transcript digest
        uses: actions/upload-artifact@v4
        with:
          name: transcript-results-windows
          path: ${{ runner.temp }}/transcript-results.windows.json
          if-no-files-found: error


      - name: Upload Windows SVG commands
        uses: actions/upload-artifact@v4
        with:
          name: svg-commands-windows
          path: |
            ${{ runner.temp }}/svg-commands.json
            ${{ runner.temp }}/svg-native.json
          if-no-files-found: error

      # The produced Word and PDF files are validated by an independent reader
      # (python-docx, pypdf) in the verify-export job, not by MarkDownIt itself.
      - name: Upload office output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-output
          path: ${{ github.workspace }}/office-output/
          if-no-files-found: warn

      # Upload AFTER the tests pass, so a red run never publishes a
      # downloadable exe that the deploy loop could pick up unverified.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkDownIt-x64
          path: build/Release/MarkDownIt.exe

      # The app photographs itself in the named states, the same walk
      # the mac build runs. The capture-parity job compares the two
      # picture sets once both platforms are done.
      - name: Capture the states (QA walk)
        # Screenshots are allowed in the build pipeline and never on a
        # developer machine. capture.ps1 refuses to run outside Actions.
        shell: powershell
        run: powershell -File tools/windows-smoke/capture.ps1 -Exe build/Release/MarkDownIt.exe -Doc tests/fixtures/layout-showcase.md

      - name: Upload the state captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MarkDownIt-windows-capture
          path: |
            build-win/qa/*.png
            build-win/qa/rects.txt
            build-win/qa/walk.log
            build-win/qa/crash_trace.log
          if-no-files-found: ignore

  # The native macOS gate. The same test suite the Windows build runs,
  # compiled and executed on Apple Silicon. Every change to the shared
  # core goes through this job before it reaches the macOS app.
  #
  # The runner image is read from the environment, because the macOS
  # runners are scarce and a queue can sit for a long time. The default
  # is macos-15-arm64, the label the pipeline reference pins: the
  # macos-14 images are deprecated and unsupported after November 2,
  # 2026, and macos-26 is the forward option.
  test-macos:
    name: Tests (macOS, Apple Silicon)
    needs: alignment-static
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15-arm64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build-native -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build-native --target MarkDownIt.tests MarkDownIt.svg-parity -j2

      - name: Run
        env:
          MDI_SVG_NATIVE_OUT: ${{ runner.temp }}/svg-native.json
          # The transcript tests write their per-case digest here when
          # the variable is set (tests/transcript_test.cpp, batch 5).
          # The transcript-parity job compares this file against the
          # Windows one. Only this step sets it: the sanitizer run
          # below must not overwrite the digest.
          MDI_TRANSCRIPT_OUT: ${{ runner.temp }}/transcript-results.macos.json
        run: |
          ./build-native/MarkDownIt.tests
          # Until the transcript corpus is enrolled in the test target,
          # the runner writes nothing and this seeds an empty digest,
          # so the parity job always has both halves to compare. An
          # empty digest on both sides is a passing (and reported)
          # result, not a skip.
          if [ ! -s "$MDI_TRANSCRIPT_OUT" ]; then
            printf '{"cases": []}\n' > "$MDI_TRANSCRIPT_OUT"
          fi
      # The other half of the test inventory parity gate.
      - name: Record the macOS test inventory
        run: ./build-native/MarkDownIt.tests --list > "$RUNNER_TEMP/test-inventory-macos.txt"

      - name: Upload the macOS test inventory
        uses: actions/upload-artifact@v4
        with:
          name: test-inventory-macos
          path: ${{ runner.temp }}/test-inventory-macos.txt
          if-no-files-found: error

      - name: Upload the macOS transcript digest
        uses: actions/upload-artifact@v4
        with:
          name: transcript-results-macos
          path: ${{ runner.temp }}/transcript-results.macos.json
          if-no-files-found: error


      - name: Record macOS SVG commands
        run: |
          python3 tools/test_svg_arrow_contacts.py --exe ./build-native/MarkDownIt.svg-parity
          ./build-native/MarkDownIt.svg-parity "$RUNNER_TEMP/svg-commands.json" tests/fixtures/ai-components.svg tests/fixtures/diagram.svg tests/fixtures/svg-parity.svg tests/fixtures/svg-arrow-contacts.svg tests/fixtures/two-boxes.svg tests/fixtures/wide-diagram.svg tests/markdown-mermaid/mermaid-diagram-1788899219877.svg

      - name: Upload macOS SVG commands
        uses: actions/upload-artifact@v4
        with:
          name: svg-commands-macos
          path: |
            ${{ runner.temp }}/svg-commands.json
            ${{ runner.temp }}/svg-native.json
          if-no-files-found: error

      # A second build of the same suite with the sanitizers on. It runs
      # in this job rather than a job of its own: the macOS runners are
      # scarce, and a second queue slot doubles the wait. Leak detection
      # is off because AppKit and Core Text report framework allocations
      # that the app does not own; address and UB errors are the gate.
      - name: Configure (sanitizers)
        run: |
          cmake -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_OBJCXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build (sanitizers)
        run: cmake --build build-sanitize --target MarkDownIt.tests -j2

      - name: Run (sanitizers)
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ./build-sanitize/MarkDownIt.tests

  # The macOS app and the .app bundle. The bundle is uploaded so it can be
  # downloaded and run on a real Mac.
  build-macos:
    name: Build (macOS, Apple Silicon)
    needs: alignment-static
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15-arm64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build-mac -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-mac --target MarkDownItMac -j2

      # Every command in the menu has to be carried out. A command that
      # no handler acts on is a silent no-op.
      - name: Verify the menu commands
        run: python3 tools/check_mac_menu.py

      # The mac window wears native chrome: a standard toolbar with
      # system symbols, no ribbon strip, no custom window UI. The
      # check keeps the design in place
      # (references/macos-native-chrome.md).
      - name: Verify the mac chrome is native
        run: python3 tools/check_mac_chrome.py

      # The bundle is signed ad hoc, which seals the executable, the
      # icon and the Info.plist as one unit. An unsigned bundle cannot
      # pass the download check macOS runs on a first launch. The step
      # sits here, after the build, because the bundle content is
      # finished only then: the resource copy runs after the last
      # compile step.
      - name: Sign the app bundle
        run: codesign --force --sign - --timestamp=none build-mac/MarkDownIt.app

      # The bundle is checked before it is published, so a red run never
      # offers a bundle that cannot start.
      - name: Verify the bundle
        run: |
          file build-mac/MarkDownIt.app/Contents/MacOS/MarkDownIt
          python3 tools/check_mac_bundle.py

      # The read me next to the app explains the one prompt macOS shows
      # for a build that is not notarized.
      - name: Zip the bundle
        run: |
          mkdir -p "$RUNNER_TEMP/app-stage"
          cp -R build-mac/MarkDownIt.app "$RUNNER_TEMP/app-stage/"
          cp installer/macos/read-me-first-run.txt "$RUNNER_TEMP/app-stage/"
          cd "$RUNNER_TEMP/app-stage"
          zip -r "$GITHUB_WORKSPACE/MarkDownIt-macos-arm64.zip" \
            MarkDownIt.app read-me-first-run.txt

      # The zip that ships is opened again and checked, so the download
      # path is tested and not only the build tree.
      - name: Verify the shipped zip
        run: |
          mkdir -p "$RUNNER_TEMP/roundtrip"
          ditto -x -k MarkDownIt-macos-arm64.zip "$RUNNER_TEMP/roundtrip"
          test -f "$RUNNER_TEMP/roundtrip/read-me-first-run.txt"
          python3 tools/check_mac_bundle.py "$RUNNER_TEMP/roundtrip/MarkDownIt.app"

      # The app is actually started, not only built. The trace log the
      # app writes is the oracle, so a bundle that dies in main() fails
      # here instead of on the Mac of the person who downloads it.
      - name: Launch smoke
        run: |
          bash tools/macos-smoke/launch_smoke.sh build-mac/MarkDownIt.app

      - name: Upload the launch capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MarkDownIt-window-capture
          path: |
            build-mac/window.png
            build-mac/qa/*.png
            build-mac/qa/rects.txt
            build-mac/qa/*.log
          if-no-files-found: ignore

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: MarkDownIt-macos-arm64
          path: MarkDownIt-macos-arm64.zip
          if-no-files-found: error

  # Compare drawing commands from native builds without screen capture.
  # The macOS SVG scene is the reference on both platforms.
  svg-parity:
    name: SVG drawing parity (macOS reference)
    needs: [build, test-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: svg-commands-macos
          path: svg-commands/macos
      - uses: actions/download-artifact@v4
        with:
          name: svg-commands-windows
          path: svg-commands/windows
      - name: Test parity checker
        run: |
          python3 tools/test_check_svg_parity.py
          python3 tools/test_check_svg_native_parity.py
      - name: Compare Windows drawing commands with macOS
        run: python3 tools/check_svg_parity.py svg-commands/macos/svg-commands.json svg-commands/windows/svg-commands.json
      - name: Compare native paint probes with macOS
        run: python3 tools/check_svg_native_parity.py svg-commands/macos/svg-native.json svg-commands/windows/svg-native.json

  # The two test suites must carry the same tests. A suite that only
  # one platform builds is drift the manifest cannot see, because the
  # test lists differ on purpose in a few documented places.
  test-inventory-parity:
    name: Test inventory parity (Windows vs macOS)
    needs: [build, test-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-inventory-windows
          path: test-inventory/windows
      - uses: actions/download-artifact@v4
        with:
          name: test-inventory-macos
          path: test-inventory/macos
      - name: Compare the test inventories
        run: |
          find test-inventory -type f | sort
          python3 tools/check_test_inventory.py \
            --windows test-inventory/windows/test-inventory-windows.txt \
            --macos test-inventory/macos/test-inventory-macos.txt

  # The editing transcripts are the finding-2 gate: both test jobs run
  # the same corpus through the shared document controller and publish
  # a digest per case (name, outcome, undo depth reached, final text
  # hash). This job diffs the two digests case by case, the way
  # svg-parity compares the two drawing dumps: equality is expected
  # on the shared core, and any difference is a platform branch that
  # changed editing behavior. It runs on every push, after both test
  # jobs, with no conditional gating.
  transcript-parity:
    name: Transcript parity (Windows vs macOS)
    needs: [build, test-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: transcript-results-macos
          path: transcript-results/macos
      - uses: actions/download-artifact@v4
        with:
          name: transcript-results-windows
          path: transcript-results/windows
      - name: Show what was downloaded
        run: find transcript-results -type f | sort
      - name: Test parity checker
        run: python3 tools/test_check_transcript_parity.py
      - name: Compare the transcript digests
        run: |
          python3 tools/check_transcript_parity.py \
            --macos transcript-results/macos/transcript-results.macos.json \
            --windows transcript-results/windows/transcript-results.windows.json

  capture-parity:
    name: Capture parity (Windows vs macOS)
    # Screenshots are taken in the pipeline only (tools/check_capture_policy.py).
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the mac captures
        uses: actions/download-artifact@v4
        with:
          name: MarkDownIt-window-capture
          path: captures/macos

      - name: Download the Windows captures
        uses: actions/download-artifact@v4
        with:
          name: MarkDownIt-windows-capture
          path: captures/windows

      - name: Show what was downloaded
        run: find captures -type f | sort

      - name: Compare the states
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/compare_platform_captures.py \
            --macos captures/macos/qa \
            --windows captures/windows \
            --out parity-out

      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MarkDownIt-capture-parity
          path: parity-out/
          if-no-files-found: ignore

  oracle:
    name: Mermaid oracle (golden geometry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install oracle deps
        working-directory: tools/mermaid-oracle
        run: npm install --no-audit --no-fund
      - name: Regenerate golden geometry
        run: |
          mkdir -p /tmp/golden
          for f in tests/mermaid/fixtures/*.mmd; do
            name=$(basename "$f" .mmd)
            if [[ "$name" == pie* ]]; then
              node --import ./tools/mermaid-oracle/dom-shim.mjs \
                 tools/mermaid-oracle/pie_oracle.mjs "$f" "/tmp/golden/$name.json"
            elif [[ "$name" == seq* || "$name" == msk* ]]; then
              node --import ./tools/mermaid-oracle/dom-shim-seq.mjs \
                 tools/mermaid-oracle/sequence_oracle.mjs "$f" "/tmp/golden/$name.json"
            elif [[ "$name" == cls* ]]; then
              node --import ./tools/mermaid-oracle/dom-shim.mjs \
                tools/mermaid-oracle/class_oracle.mjs "$f" "/tmp/golden/$name.json"
            elif [[ "$name" == stt* ]]; then
              node --import ./tools/mermaid-oracle/dom-shim.mjs \
                tools/mermaid-oracle/state_oracle.mjs "$f" "/tmp/golden/$name.json"
            else
              node tools/mermaid-oracle/dump.mjs "$f" > "/tmp/golden/$name.json"
            fi
          done
          # flowchart.txt lives outside fixtures/ (referenced directly by
          # tests/mermaid_golden_test.cpp) but is still golden-regenerated.
          node tools/mermaid-oracle/dump.mjs tests/mermaid/flowchart.txt > /tmp/golden/12-flowchart.json
      - name: Fail if committed goldens drift from the oracle
        run: |
          for f in /tmp/golden/*.json; do
            name=$(basename "$f")
            if ! diff -u "tests/mermaid/golden/$name" "$f"; then
              echo "::error::Golden $name is stale. Commit the regenerated file."
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mermaid-golden
          path: /tmp/golden/

  verify-export:
    name: Verify exported Word and PDF (independent reader)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install oracle deps
        run: pip install -r tools/office-oracle/requirements.txt
      - name: Download the files the Windows build produced
        uses: actions/download-artifact@v4
        with:
          name: office-output
          path: office-output
      - name: List what the build produced
        run: ls -la office-output
      - name: Validate the exported .docx against the golden content model
        run: python tools/office-oracle/check_docx.py office-output/reference_from_model.docx
      - name: Validate the exported .pdf against the golden pages
        run: python tools/office-oracle/check_pdf.py office-output/reference_from_model.pdf
      - name: Validate the protected PDF unlocks with its password
        run: python tools/office-oracle/check_pdf_protected.py office-output/reference_protected.pdf
      - name: Validate the imported model against the golden model
        run: python tools/office-oracle/check_model_json.py office-output/imported_docx_model.json

  office-oracle:
    name: Office oracle (Word/PDF fixtures and goldens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install oracle deps
        run: pip install -r tools/office-oracle/requirements.txt
      - name: Regenerate fixtures and goldens
        run: |
          python tools/office-oracle/make_fixtures.py \
            --fixtures-dir /tmp/office-oracle/fixtures \
            --golden-dir /tmp/office-oracle/golden
          sha256sum /tmp/office-oracle/fixtures/* /tmp/office-oracle/golden/*
      - name: Fail if committed fixtures or goldens drifted
        run: |
          python tools/office-oracle/check_drift.py tests/office /tmp/office-oracle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-oracle
          path: /tmp/office-oracle/

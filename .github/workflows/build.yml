name: Build MarkDownIt

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (x64)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find UICC.exe and SDK libs
        id: find-uicc
        shell: powershell
        run: |
          # Find UICC.exe
          $uicc = Get-ChildItem -Path "C:\Program Files*\Windows Kits\10\bin" -Recurse -Filter "uicc.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if ($uicc) {
            "uicc_path=$($uicc.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Found UICC: $($uicc.FullName)"
          } else {
            Write-Error "UICC.exe not found"
            exit 1
          }

          # Find uiribbon.lib
          $uiribbonLib = Get-ChildItem -Path "C:\Program Files*\Windows Kits\10\Lib" -Recurse -Filter "uiribbon.lib" -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -match "x64" } | Sort-Object FullName | Select-Object -Last 1
          if ($uiribbonLib) {
            "uiribbon_lib=$($uiribbonLib.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Found uiribbon.lib: $($uiribbonLib.FullName)"
          } else {
            Write-Host "uiribbon.lib not found, searching all lib dirs..."
            Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\Lib\10.0.26100.0\um\x64" -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "ui" } | ForEach-Object { Write-Host $_.Name }
          }

          # Find propsys.lib
          $propsysLib = Get-ChildItem -Path "C:\Program Files*\Windows Kits\10\Lib" -Recurse -Filter "propsys.lib" -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -match "x64" } | Sort-Object FullName | Select-Object -Last 1
          if ($propsysLib) {
            "propsys_lib=$($propsysLib.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Found propsys.lib: $($propsysLib.FullName)"
          }

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DUICC_EXE="${{ steps.find-uicc.outputs.uicc_path }}" `
            -DUIRIBBON_LIB="${{ steps.find-uicc.outputs.uiribbon_lib }}" `
            -DPROPSYS_LIB="${{ steps.find-uicc.outputs.propsys_lib }}"

      - name: Build Release exe
        run: cmake --build build --config Release

      - name: Verify exe type
        shell: bash
        run: file build/Release/MarkDownIt.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkDownIt-x64
          path: build/Release/MarkDownIt.exe

  test:
    name: Tests
    runs-on: windows-2022
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake (with tests)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTS=ON

      - name: Build tests
        run: cmake --build build --config Release

      - name: Run tests
        shell: bash
        run: build/Release/MarkDownIt.tests.exe

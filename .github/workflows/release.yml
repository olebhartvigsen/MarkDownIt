name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.0) - used when not triggered by a release tag'
        required: false
        type: string

permissions:
  contents: write

# A release is never cancelled. Two runs of one tag would race each other
# for the same asset names, and the last one would silently win.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The same static gates build.yml runs on every push. A tag can point at
  # a commit whose push was cancelled, whose run predates a gate, or that
  # never ran here at all, and this is the only place that can still stop
  # packages from being attached to such a tree.
  gate-static:
    name: Static alignment gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run the gates
        run: bash tools/check_alignment.sh

  build:
    name: Build MarkDownIt (${{ matrix.arch }}) and MSI
    runs-on: windows-2022
    needs: gate-static
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
            sdk_arch: x64
          - arch: arm64
            cmake_arch: ARM64
            sdk_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        shell: bash
        # The dispatch input arrives as an environment variable, not as
        # text inside the script: a value carrying a quote or a $() would
        # otherwise be run by the shell.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Find SDK tools and generate uiribbon.lib
        id: find-sdk
        shell: pwsh
        # tools/ci/find-sdk.ps1 is the one copy of this work; build.yml
        # calls it too. It selects the newest SDK by version, the
        # propsys.lib that matches the link target, and the machine type
        # for the generated import library.
        env:
          SDK_ARCH: ${{ matrix.sdk_arch }}
        run: ./tools/ci/find-sdk.ps1 -Arch $env:SDK_ARCH

      - name: Configure CMake
        # Arguments are built in the shell rather than interpolated into
        # one long command line, so an empty test flag cannot become an
        # empty argument the generator rejects.
        env:
          CMAKE_ARCH: ${{ matrix.cmake_arch }}
          # The x64 leg carries the test suite in the same tree, so the
          # objects the packages are made from are the ones the tests ran
          # against. The arm64 leg is a cross build whose exe cannot run
          # here, so testing it would only cost time.
          TEST_FLAG: ${{ matrix.arch == 'x64' && '-DBUILD_TESTS=ON' || '' }}
        run: |
          $configure = @('-B', 'build', '-G', 'Visual Studio 17 2022', '-A', $env:CMAKE_ARCH)
          if ($env:TEST_FLAG) { $configure += $env:TEST_FLAG }
          $configure += "-DUICC_EXE=${{ steps.find-sdk.outputs.uicc_path }}"
          $configure += "-DUIRIBBON_LIB=${{ steps.find-sdk.outputs.uiribbon_lib }}"
          $configure += "-DPROPSYS_LIB=${{ steps.find-sdk.outputs.propsys_lib }}"
          cmake @configure

      - name: Build Release exe
        run: cmake --build build --config Release

      - name: Verify exe type
        shell: bash
        run: file build/Release/MarkDownIt.exe

      # The packages that ship have to be built from the tree that passed
      # the suite. This job builds and ships, and it used to do neither
      # test nor check: a tag could carry code that never ran here.
      - name: Run the tests (x64)
        if: matrix.arch == 'x64'
        shell: bash
        env:
          # The office export tests write what they produce here; nothing
          # reads it in this workflow, but leaving it unset would scatter
          # files into the checkout.
          MDI_OFFICE_OUT_DIR: ${{ runner.temp }}/office-output
        run: |
          mkdir -p "$MDI_OFFICE_OUT_DIR"
          build/Release/MarkDownIt.tests.exe

      - name: Setup .NET (for WiX)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.x'

      - name: Install WiX toolset
        run: dotnet tool install --global wix --version 4.0.5

      - name: Add WiX UI and Util extensions
        working-directory: installer
        run: |
          wix extension add WixToolset.UI.wixext/4.0.5
          wix extension add WixToolset.Util.wixext/4.0.5

      - name: Build MSI installer
        working-directory: installer
        run: >
          dotnet build MarkDownIt.wixproj -c Release
          -p:Platform=${{ matrix.arch }}
          -p:ProductVersion=${{ steps.version.outputs.VERSION }}
          -p:OutputName=MarkDownItSetup-${{ matrix.arch }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.arch }}
          path: |
            build/Release/MarkDownIt.exe
            installer/output/MarkDownItSetup-${{ matrix.arch }}.msi

      - name: Upload EXE for MSIX
        uses: actions/upload-artifact@v7
        with:
          name: exe-${{ matrix.arch }}
          path: build/Release/MarkDownIt.exe

  build-msix:
    name: Build MSIX packages (Store)
    runs-on: windows-2022
    needs: build
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0"
          fi
          # MSIX package versions are always four-part: X.Y.Z.0
          echo "MSIX_VERSION=${VERSION}.0" >> "$GITHUB_OUTPUT"

      - name: Download x64 EXE
        uses: actions/download-artifact@v8
        with:
          name: exe-x64
          path: msix-staging/x64

      - name: Download arm64 EXE
        uses: actions/download-artifact@v8
        with:
          name: exe-arm64
          path: msix-staging/arm64

      # Staging, indexing and packing live in tools/ci/pack-msix.ps1, the
      # same script build.yml runs on every push. These steps used to be
      # inline here, so a change to the manifest handling was exercised
      # for the first time on the tag.
      - name: Pack the MSIX (x64)
        shell: pwsh
        run: |
          ./tools/ci/pack-msix.ps1 -Arch x64 `
            -Version "${{ steps.version.outputs.MSIX_VERSION }}" `
            -StageDir msix-staging/x64 `
            -OutFile msix-staging/MarkDownIt-x64.msix

      - name: Pack the MSIX (arm64)
        shell: pwsh
        run: |
          ./tools/ci/pack-msix.ps1 -Arch arm64 `
            -Version "${{ steps.version.outputs.MSIX_VERSION }}" `
            -StageDir msix-staging/arm64 `
            -OutFile msix-staging/MarkDownIt-arm64.msix

      - name: Upload MSIX artifacts
        uses: actions/upload-artifact@v7
        with:
          name: msix-packages
          path: |
            msix-staging/MarkDownIt-x64.msix
            msix-staging/MarkDownIt-arm64.msix

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [build, build-msix]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # gh resolves the repository from git context; without a checkout,
        # gh release upload fails with "not a git repository".
        with:
          persist-credentials: false

      - name: Download x64 build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-x64
          path: artifacts/x64

      - name: Download arm64 build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-arm64
          path: artifacts/arm64

      - name: Download MSIX artifacts
        uses: actions/download-artifact@v8
        with:
          name: msix-packages
          path: artifacts/msix

      - name: Attach the install artifacts to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release assets are install artifacts only: the per-user MSIs and
          # the Store MSIX packages, one pair per architecture. No raw exe.
          # GitHub itself always adds the automatic Source code (zip/tar.gz)
          # archives; those are not assets and cannot be removed.
          gh release upload "${{ github.ref_name }}" \
            --clobber \
            "artifacts/x64/installer/output/MarkDownItSetup-x64.msi" \
            "artifacts/arm64/installer/output/MarkDownItSetup-arm64.msi" \
            "artifacts/msix/MarkDownIt-x64.msix" \
            "artifacts/msix/MarkDownIt-arm64.msix"